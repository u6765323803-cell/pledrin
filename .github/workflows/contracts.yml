name: contracts

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
      - ".github/scripts/coverage-gate.sh"

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  MINIMUM_COVERAGE: "95"

defaults:
  run:
    working-directory: contracts

jobs:
  build:
    name: build and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      # Fork tests are excluded here so that a flaky public RPC can never fail
      # the deterministic suite. They run in their own job below.
      - name: Unit, fuzz and invariant tests
        run: forge test --no-match-path "test/fork/*" -vvv

      - name: Gas report
        run: forge test --no-match-path "test/fork/*" --gas-report

  fork:
    name: fork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      # These run against the live Uniswap v4 contracts on Robinhood Chain and
      # are the only tests that need the network. The mainnet RPC prunes
      # historical state, so the fork cannot be pinned to a block; every
      # assertion here is about v4's code rather than chain state, which is what
      # makes running at head sound.
      - name: Fork tests against live Uniswap v4
        run: |
          forge test --match-path "test/fork/*" \
            --rpc-url robinhood --fork-retries 5 --fork-retry-backoff 2000 -vvv

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Coverage is measured at the default profile rather than the `ci` one. It is a
    # reachability measure, not a search: 1,024 fuzz runs reach the same lines 10,000
    # would, and `forge coverage` compiles with the optimizer and the IR pipeline off, so
    # the heavier profile costs a great deal of time and buys no coverage. The `test` job
    # above is where the `ci` profile's run counts earn their keep. Both profiles set
    # `deny = "warnings"`, so nothing is relaxed here.
    env:
      FOUNDRY_PROFILE: default
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      # Until the first contract lands there is nothing to measure, and an
      # empty report would otherwise read as a failure.
      - name: Check for sources
        id: sources
        run: |
          if compgen -G "src/**/*.sol" > /dev/null || compgen -G "src/*.sol" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Solidity sources under contracts/src yet; skipping coverage."
          fi

      # The fork tests are excluded for the same reason the `test` job excludes them,
      # and here it matters more: this is a hard gate, and a gate that a flaky public
      # RPC can fail is a gate people learn to ignore. The bar is therefore cleared by
      # the deterministic suite alone, which is also the number quoted in review.
      - name: Measure coverage
        if: steps.sources.outputs.present == 'true'
        run: |
          forge coverage --no-match-path "test/fork/*" --exclude-tests \
            --report lcov --report-file lcov.info --report summary

      - name: Enforce minimum coverage
        if: steps.sources.outputs.present == 'true'
        run: ../.github/scripts/coverage-gate.sh lcov.info "$MINIMUM_COVERAGE"

      - name: Upload coverage report
        if: steps.sources.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: contracts/lcov.info
