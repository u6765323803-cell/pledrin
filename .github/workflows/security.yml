name: security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so a secret introduced in an earlier commit of the
          # branch is still caught.
          fetch-depth: 0

      # The binary is used directly rather than the marketplace action, which
      # gates organization use behind a licence key.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git --redact --verbose --exit-code 1

      - name: Scan working tree
        run: gitleaks dir --redact --verbose --exit-code 1

  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check for sources
        id: sources
        run: |
          if compgen -G "contracts/src/**/*.sol" > /dev/null || compgen -G "contracts/src/*.sol" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Solidity sources under contracts/src yet; skipping Slither."
          fi

      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.sources.outputs.present == 'true'
        with:
          version: v1.9.0

      - uses: actions/setup-python@v5
        if: steps.sources.outputs.present == 'true'
        with:
          python-version: '3.12'

      # Slither is installed and pinned here rather than taken from
      # crytic/slither-action, so the version CI runs is the version a reviewer
      # runs locally. A static analyser that disagrees with itself between the
      # two is worse than one that is merely strict.
      - name: Install Slither
        if: steps.sources.outputs.present == 'true'
        env:
          SLITHER_VERSION: 0.11.6
        run: |
          pip install --disable-pip-version-check "slither-analyzer==${SLITHER_VERSION}"
          slither --version

      - name: Run Slither
        if: steps.sources.outputs.present == 'true'
        working-directory: contracts
        run: |
          set +e
          slither . --config-file slither.config.json --fail-high \
            > "${RUNNER_TEMP}/slither.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/slither.log"

          # Slither reports any function whose intermediate representation it
          # could not build, then runs every detector over the incomplete model
          # without changing its exit code: on this repository
          # `--no-fail-pedantic` returns 0 even with six function bodies missing
          # from the analysis. An analysis that silently covers less than the
          # whole program is worse than no analysis at all, because it reads as a
          # clean run and its absent findings look like their absence was
          # measured. Nothing in the exit code catches this, so catch it here.
          if grep -q 'ERROR:ContractSolcParsing' "${RUNNER_TEMP}/slither.log"; then
            echo "::error::Slither could not analyse one or more function bodies, so its findings cover less than the whole program. See docs/SECURITY_NOTES.md."
            grep 'ERROR:ContractSolcParsing' "${RUNNER_TEMP}/slither.log"
            exit 1
          fi

          exit "$status"

      - name: Upload Slither log
        if: always() && steps.sources.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slither-log
          path: ${{ runner.temp }}/slither.log
          if-no-files-found: ignore
