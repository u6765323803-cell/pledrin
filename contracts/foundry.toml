[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
# `BondingCurve` is a full per-launch deployment, so the contract that carries its
# creation code has to fit under EIP-170's 24,576-byte limit with it. At 1,000,000 runs it
# does not: the optimizer trades size for execution gas, and per docs/CHAIN_FACTS.md the
# cost on this chain is dominated by L1 data posting rather than L2 execution, so that is
# the wrong trade here as well as an undeployable one. 200 runs with the IR pipeline keeps
# every contract inside the limit; `forge build --sizes` is the check that holds this.
optimizer_runs = 200
# One consequence for test authors: with the IR pipeline the optimizer may rematerialise a
# `block.timestamp` read across an external call, so a value cached in a local before a
# `vm.warp` is not reliable afterwards. Derive warp targets from contract state — a
# schedule's `start`, a timelock's `readyAt` — rather than from a cached timestamp.
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

# Fail the build on any warning so nothing sloppy reaches review.
deny = "warnings"

gas_reports = ["*"]
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 1024
max_test_rejects = 500_000

[profile.default.invariant]
runs = 512
depth = 100
fail_on_revert = false
shrink_run_limit = 5000

# Heavier settings for CI and pre-release sweeps.
[profile.deep.fuzz]
runs = 50_000

[profile.deep.invariant]
runs = 5_000
depth = 250

[profile.ci]
deny = "warnings"

[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 1_000
depth = 150

# The Solidity linter runs as part of `forge build`, and `deny = "warnings"` makes any
# finding fatal. Two lints are excluded project-wide because they are inapplicable to this
# codebase by construction rather than case by case. Every other finding is either fixed
# or carries an inline suppression stating why that specific line is intended.
#
# block-timestamp    docs/CHAIN_FACTS.md rules out `block.number` on this Nitro chain and
#                    docs/SPEC.md section 1 requires `block.timestamp` for all time logic,
#                    so every deadline, vesting and timelock comparison is deliberate.
# reentrancy-events  the detector treats an internal library call such as
#                    `CurveMath.sellQuote` as an external call, so it fires on events
#                    emitted before a function's only real external call. Every function
#                    it reports holds a reentrancy guard, so no reentrant call can
#                    reorder or fabricate a log.
[lint]
exclude_lints = ["block-timestamp", "reentrancy-events"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"
sort_imports = true

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
